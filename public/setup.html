<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial Setup</title><link rel="stylesheet" href="/css/app.css"></head><body>
<div class="login-wrap"><div class="card login-card"><h1>Initial Setup</h1><p class="subtle">Create the first bishop account. This only works while the users table is empty.</p><div id="msg"></div><form id="setup"><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><div class="field"><label>Bootstrap secret</label><input id="secret" type="password" required></div><button class="btn primary" style="width:100%">Create bishop account</button></form></div></div>
<script type="module">import{api}from'/js/api.js';setup.onsubmit=async e=>{e.preventDefault();msg.innerHTML='';try{await api('/api/bootstrap',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,password:password.value,secret:secret.value})});msg.innerHTML='<div class="notice">Account created. You can now sign in.</div>';setTimeout(()=>location.href='/login.html',900)}catch(x){msg.innerHTML=`<div class="notice error">${x.message}</div>`}}</script></body></html>
