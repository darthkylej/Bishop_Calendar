<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Availability</title><link rel="stylesheet" href="/css/app.css"></head><body><header class="topbar"><div class="brand">Bishop Interview Calendar</div><nav class="nav"></nav></header><main class="wrap"><div class="toolbar"><h1>Availability</h1></div><div class="admin-grid"><section class="card section"><h2>Recurring weekly availability</h2><form id="ruleForm" class="inline-form"><div><label>Day</label><select id="day"><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></div><div><label>Type</label><select id="pref"><option value="preferred">Preferred</option><option value="available">Available if needed</option></select></div><div><label>Start</label><input id="start" type="time" step="300" value="09:00" required></div><div><label>End</label><input id="end" type="time" step="300" value="10:00" required></div><div class="wide"><button class="btn primary">Add time range</button></div></form><div id="rules"></div></section><section class="card section"><h2>Date exceptions</h2><p class="subtle">Add special availability or block part of a normally available day.</p><form id="overrideForm" class="inline-form"><div><label>Date</label><input id="odate" type="date" required></div><div><label>Action</label><select id="otype"><option value="block">Block time</option><option value="add">Add availability</option></select></div><div><label>Start</label><input id="ostart" type="time" step="300" value="09:00" required></div><div><label>End</label><input id="oend" type="time" step="300" value="10:00" required></div><div id="oprefWrap"><label>Type</label><select id="opref"><option value="preferred">Preferred</option><option value="available">Available if needed</option></select></div><div><label>Note</label><input id="onote"></div><div class="wide"><button class="btn primary">Add exception</button></div></form><div id="overrides"></div></section></div></main><script type="module" src="/js/availability.js"></script></body></html>
