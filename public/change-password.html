<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password</title><link rel="stylesheet" href="/css/app.css"></head><body>
<div class="login-wrap"><div class="card login-card"><h1>Change Password</h1><p class="subtle" id="intro">Choose a new password for your account.</p><div id="msg"></div><form id="passwordForm"><div class="field" id="currentField"><label>Current password</label><input id="currentPassword" type="password" autocomplete="current-password"></div><div class="field"><label>New password</label><input id="newPassword" type="password" required autocomplete="new-password"></div><div class="field"><label>Confirm new password</label><input id="confirmPassword" type="password" required autocomplete="new-password"></div><button class="btn primary" style="width:100%">Save password</button></form><button class="btn" id="cancelBtn" style="width:100%;margin-top:10px">Cancel</button><button class="btn" id="logoutBtn" style="width:100%;margin-top:10px;display:none">Sign out</button></div></div>
<script type="module">import{api,esc}from'/js/api.js';const form=document.getElementById('passwordForm'),msg=document.getElementById('msg'),intro=document.getElementById('intro'),currentField=document.getElementById('currentField'),currentPassword=document.getElementById('currentPassword'),newPassword=document.getElementById('newPassword'),confirmPassword=document.getElementById('confirmPassword'),cancelBtn=document.getElementById('cancelBtn'),logoutBtn=document.getElementById('logoutBtn');let user;try{user=(await api('/api/me')).user}catch{location.href='/login.html'}if(user){if(user.must_change_password){intro.textContent='Your current password is temporary. Choose your own password before continuing.';currentField.style.display='none';cancelBtn.style.display='none';logoutBtn.style.display='block';newPassword.focus()}else currentPassword.focus()}cancelBtn.onclick=()=>location.href='/';logoutBtn.onclick=async()=>{await api('/api/logout',{method:'POST'});location.href='/login.html'};form.onsubmit=async e=>{e.preventDefault();msg.innerHTML='';if(newPassword.value!==confirmPassword.value){msg.innerHTML='<div class="notice error">The new passwords do not match.</div>';return}try{await api('/api/change-password',{method:'POST',body:JSON.stringify({current_password:currentPassword.value,new_password:newPassword.value})});if(user?.must_change_password){location.href='/';return}currentPassword.value='';newPassword.value='';confirmPassword.value='';msg.innerHTML='<div class="notice">Password changed.</div>';currentPassword.focus()}catch(x){msg.innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}</script></body></html>
