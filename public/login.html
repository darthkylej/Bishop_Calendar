<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bishop Interview Calendar</title><link rel="stylesheet" href="/css/app.css"></head><body>
<div class="login-wrap"><div class="card login-card"><h1>Bishop Interview Calendar</h1><p class="subtle">Sign in to view or manage the interview schedule.</p><div id="msg"></div><form id="login"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%">Sign in</button></form></div></div>
<script type="module">import{api,esc}from'/js/api.js';const form=document.getElementById('login'),m=document.getElementById('msg'),email=document.getElementById('email'),password=document.getElementById('password');form.onsubmit=async e=>{e.preventDefault();m.innerHTML='';try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});location.href=d.user?.must_change_password?'/change-password.html':'/'}catch(x){m.innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}</script></body></html>
