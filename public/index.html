<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bishop Interview Calendar</title><link rel="stylesheet" href="/css/app.css"></head><body>
<header class="topbar"><div class="brand">Bishop Interview Calendar</div><nav class="nav"></nav></header><main class="wrap"><div class="toolbar"><h1 id="weekTitle">Week</h1><div class="toolbar-group"><button class="btn" id="prev">‹</button><button class="btn" id="today">Today</button><button class="btn" id="next">›</button></div></div><div class="card calendar-shell"><div id="calendar"></div></div><div class="legend"><span><i class="swatch pref"></i>Preferred</span><span><i class="swatch avail"></i>Available if needed</span><span><i class="swatch busy"></i>Appointment</span></div></main>
<div class="drawer-backdrop" id="drawer"><div class="drawer"><button class="btn" style="float:right" id="closeDrawer">Close</button><h2 id="drawerTitle">Schedule appointment</h2><div class="subtle" id="drawerWhen"></div><div id="drawerMsg"></div><form id="apptForm"><input type="hidden" id="apptId"><div class="field"><label>Person or family</label><input id="person" required></div><div class="field"><label>Start time</label><input id="startTime" type="time" step="900" required></div><div class="field"><label>Duration</label><div class="durations" id="durations"></div></div><div class="field"><label>Appointment type</label><select id="type"><option>Interview</option><option>Temple Recommend</option><option>Calling</option><option>Youth</option><option>Counseling</option><option>Other</option></select></div><div class="field"><label>Notes</label><textarea id="notes"></textarea></div><div class="field" id="statusField" style="display:none"><label>Status</label><select id="status"><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="no_show">No Show</option><option value="needs_rescheduling">Needs Rescheduling</option><option value="cancelled">Cancelled</option></select></div><div class="actions"><button type="button" class="btn danger" id="cancelAppt" style="display:none">Cancel appointment</button><button class="btn primary">Save</button></div></form></div></div>
<script type="module" src="/js/schedule.js"></script></body></html>
