<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bishop Interview Calendar</title><link rel="stylesheet" href="/css/app.css"></head><body class="schedule-page">
<header class="topbar"><div class="brand">Bishop Interview Calendar</div><nav class="nav"></nav></header><main class="wrap schedule-wrap"><div class="toolbar schedule-toolbar"><div class="week-heading"><h1 id="weekTitle">Week</h1><div id="schedulePrompt" class="schedule-prompt" hidden></div></div><button class="btn reminder-btn" id="recurringBtn" aria-label="Appointments Needed">Appointments Needed</button><div class="toolbar-group week-nav"><button class="btn" id="prev" aria-label="Previous week">‹</button><button class="btn" id="today">Today</button><button class="btn" id="next" aria-label="Next week">›</button></div></div><div class="card calendar-shell"><div id="calendar"></div></div><div class="legend"><span><i class="swatch pref"></i>Preferred</span><span><i class="swatch avail"></i>Available if needed</span><span><i class="swatch tentative"></i>Tentative</span><span><i class="swatch confirmed"></i>Confirmed</span></div></main>

<div class="drawer-backdrop" id="drawer"><div class="drawer"><button class="btn" style="float:right" id="closeDrawer">Close</button><h2 id="drawerTitle">Schedule appointment</h2><div class="subtle" id="drawerWhen"></div><div id="drawerMsg"></div><form id="apptForm"><input type="hidden" id="apptId"><input type="hidden" id="recurringId"><div class="field"><label>Person or family</label><input id="person" required autocomplete="name"></div><div class="field"><label>Start time</label><input id="startTime" type="time" step="300" required></div><div class="field"><label>Duration</label><div class="durations" id="durations"></div></div><div class="field"><label>Appointment type</label><select id="type"><option>Interview</option><option>Temple Recommend</option><option>Calling</option><option>Youth</option><option>Counseling</option><option>Other</option></select></div><div class="field"><label>Confirmation</label><select id="confirmationStatus"><option value="confirmed" selected>Confirmed</option><option value="tentative">Tentative — holding this time</option></select></div><div class="field"><label>Notes</label><textarea id="notes"></textarea></div><div class="field" id="statusField" style="display:none"><label>Appointment status</label><select id="status"><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="no_show">No Show</option><option value="needs_rescheduling">Needs Rescheduling</option><option value="cancelled">Cancelled</option></select></div><div class="actions"><button type="button" class="btn danger" id="cancelAppt" style="display:none">Cancel appointment</button><button class="btn primary">Save</button></div></form></div></div>

<div class="drawer-backdrop" id="recurringDrawer"><div class="drawer recurring-drawer"><button class="btn" style="float:right" id="closeRecurring">Close</button><h2>Appointments Needed</h2><div class="subtle" id="recurringWeek"></div><div id="recurringMsg"></div><div id="recurringList" class="recurring-list"></div><section id="recurringAdmin" class="recurring-admin" hidden><h3 id="recurringAdminTitle">Add recurring interview</h3><form id="recurringForm"><input type="hidden" id="editingRecurringId"><div class="field"><label>Name</label><input id="recurringName" required autocomplete="name"></div><div class="recurrence-row"><div class="field"><label>Every</label><input id="frequencyCount" type="number" min="1" max="365" value="1" required></div><div class="field"><label>Period</label><select id="frequencyUnit"><option value="weeks">Week(s)</option><option value="months" selected>Month(s)</option><option value="days">Day(s)</option></select></div></div><div class="field"><label>Next due date</label><input id="firstDue" type="date" required></div><div class="recurring-form-actions"><button type="button" class="btn" id="cancelRecurringEdit" hidden>Cancel edit</button><button class="btn primary" id="recurringSubmit">Add recurring interview</button></div></form></section></div></div>

<script type="module" src="/js/schedule.js"></script></body></html>
