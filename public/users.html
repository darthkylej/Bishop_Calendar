<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users</title><link rel="stylesheet" href="/css/app.css"></head><body><header class="topbar"><div class="brand">Bishop Interview Calendar</div><nav class="nav"></nav></header><main class="wrap"><div class="toolbar"><h1>Users</h1></div><div class="admin-grid"><section class="card section"><h2>Add user</h2><form id="userForm"><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Temporary password</label><input id="password" type="password" required><div class="subtle" style="margin-top:6px">They will be required to replace this password after their first sign-in.</div></div><div class="field"><label>Role</label><select id="role"><option value="scheduler">Scheduler</option><option value="viewer">Viewer</option><option value="bishop">Bishop</option></select></div><div id="userMsg"></div><button class="btn primary">Add user</button></form></section><section class="card section"><h2>Authorized users</h2><div id="users"></div></section></div></main><script type="module" src="/js/users.js"></script></body></html>
